kind = "web"
previewPath = "/"
title = "JARVIS V5.0"
version = "1.0.0"
id = "artifacts/jarvis-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22829

[services.development]
run = "pnpm --filter @workspace/jarvis-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jarvis-ui", "run", "build" ]
publicDir = "artifacts/jarvis-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22829"
BASE_PATH = "/"
